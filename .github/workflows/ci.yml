name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Ephemeral CI-only container credentials; not secrets.
  MSSQL_SA_PASSWORD: "DbRelay_CI_Pa55w0rd!"
  ORACLE_PASSWORD: "DbRelay_CI_Pa55w0rd"
  MYSQL_ROOT_PASSWORD: "DbRelay_CI_Pa55w0rd"

jobs:
  build-test:
    name: Build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # One shared database per engine for all four target-framework test processes.
    # Test fixtures fall back to Testcontainers only when DBRELAY_TEST_* is unset (local development).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbrelay_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 30
      # Oracle Database 23ai Free (gvenzl images: https://github.com/gvenzl/oci-oracle-free). Tests connect as SYSTEM because each
      # test creates its own schema, which in Oracle is a user.
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ${{ env.ORACLE_PASSWORD }}
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
      # MySQL 8.4 LTS. Tests connect as root because each test creates its own schema, which in MySQL is a database.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent" --health-interval 5s --health-timeout 5s --health-retries 40

    env:
      DBRELAY_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=dbrelay_tests;Include Error Detail=true"
      DBRELAY_TEST_SQLSERVER: "Server=localhost,1433;User ID=sa;Password=DbRelay_CI_Pa55w0rd!;TrustServerCertificate=true;Database=dbrelay_tests"
      DBRELAY_TEST_ORACLE: "User Id=system;Password=DbRelay_CI_Pa55w0rd;Data Source=localhost:1521/FREEPDB1"
      DBRELAY_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=DbRelay_CI_Pa55w0rd;SslMode=Preferred;AllowPublicKeyRetrieval=true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Create SQL Server test database
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -b \
            -Q "IF DB_ID('dbrelay_tests') IS NULL CREATE DATABASE dbrelay_tests;"

      - name: Restore (includes NuGet vulnerability audit; warnings are errors)
        run: dotnet restore DbRelay.slnx

      - name: Verify formatting
        run: dotnet format DbRelay.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DbRelay.slnx -c Release --no-restore

      - name: Test (unit, conformance, providers, integration; all target frameworks)
        run: dotnet test --solution DbRelay.slnx -c Release --no-build --results-directory TestResults

      - name: Dependency vulnerability report (direct + transitive)
        run: |
          dotnet list DbRelay.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"; exit 1
          fi

      - name: Pack
        run: dotnet pack DbRelay.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*nupkg

  postgres-compat:
    name: PostgreSQL ${{ matrix.postgres }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbrelay_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DBRELAY_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=dbrelay_tests;Include Error Detail=true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: PostgreSQL provider tests (net10.0)
        run: dotnet test --project tests/DbRelay.PostgreSql.Tests -c Release -f net10.0
      - name: Integration tests (net10.0)
        run: dotnet test --project tests/DbRelay.IntegrationTests -c Release -f net10.0

  # SQL Server 2022 runs in build-test. The provider suite runs with and without READ_COMMITTED_SNAPSHOT on each version.
  sqlserver-compat:
    name: SQL Server ${{ matrix.sqlserver }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sqlserver: ["2019", "2025"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports: ["1433:1433"]
        # Older images ship sqlcmd under mssql-tools, newer ones under mssql-tools18.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DBRELAY_TEST_SQLSERVER: "Server=localhost,1433;User ID=sa;Password=DbRelay_CI_Pa55w0rd!;TrustServerCertificate=true;Database=dbrelay_tests"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Create SQL Server test database and record the version
        run: |
          id=${{ job.services.mssql.id }}
          if docker exec "$id" test -x /opt/mssql-tools18/bin/sqlcmd; then sqlcmd="/opt/mssql-tools18/bin/sqlcmd -C"; else sqlcmd="/opt/mssql-tools/bin/sqlcmd"; fi
          docker exec "$id" $sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -b \
            -Q "IF DB_ID('dbrelay_tests') IS NULL CREATE DATABASE dbrelay_tests; SELECT @@VERSION;"
      - name: SQL Server provider tests (net10.0)
        run: dotnet test --project tests/DbRelay.SqlServer.Tests -c Release -f net10.0

  # Oracle 23ai Free runs in build-test. 21c XE is the oldest Oracle version with a free container image.
  oracle-compat:
    name: Oracle ${{ matrix.oracle.name }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        oracle:
          - { name: "21c XE", image: "gvenzl/oracle-xe:21-slim-faststart", service: "XEPDB1" }
    services:
      oracle:
        image: ${{ matrix.oracle.image }}
        env:
          ORACLE_PASSWORD: ${{ env.ORACLE_PASSWORD }}
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
    env:
      DBRELAY_TEST_ORACLE: "User Id=system;Password=DbRelay_CI_Pa55w0rd;Data Source=localhost:1521/${{ matrix.oracle.service }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Record the Oracle version
        run: docker exec ${{ job.services.oracle.id }} bash -c "echo 'SELECT BANNER_FULL FROM V\$VERSION;' | sqlplus -s system/$ORACLE_PASSWORD@localhost:1521/${{ matrix.oracle.service }}" || true
      - name: Oracle provider tests (net10.0)
        run: dotnet test --project tests/DbRelay.Oracle.Tests -c Release -f net10.0

  # MySQL 8.4 runs in build-test. MySQL 8.0 covers Aurora MySQL 3 and RDS for MySQL 8.0; MariaDB 10.11 and 11.4 are its LTS lines.
  mysql-compat:
    name: ${{ matrix.db.name }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: "MySQL 8.0", image: "mysql:8.0", health: "mysqladmin ping -h 127.0.0.1 -uroot -pDbRelay_CI_Pa55w0rd --silent" }
          - { name: "MariaDB 10.11", image: "mariadb:10.11", health: "healthcheck.sh --connect --innodb_initialized" }
          - { name: "MariaDB 11.4", image: "mariadb:11.4", health: "healthcheck.sh --connect --innodb_initialized" }
    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.db.health }}" --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      DBRELAY_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=DbRelay_CI_Pa55w0rd;SslMode=Preferred;AllowPublicKeyRetrieval=true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Record the server version
        run: docker exec ${{ job.services.mysql.id }} sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT VERSION()" 2>/dev/null || mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -e "SELECT VERSION()"' || true
      - name: MySQL provider tests (net10.0)
        run: dotnet test --project tests/DbRelay.MySql.Tests -c Release -f net10.0
