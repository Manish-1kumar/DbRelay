name: Soak (MySQL)

# On-demand soak/chaos run of tests/DbRelay.Soak against MySQL 8.4 LTS. GitHub-hosted jobs are limited to 6 hours, so the default
# load phase is 320 minutes, leaving time for the drain and verification.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Load phase in minutes (the job limit is 360 minutes in total)"
        default: "320"
      rate:
        description: "Base rate in messages per second (with a 10x burst for 20 s every 5 minutes)"
        default: "1.7"
      workers:
        description: "Worker processes"
        default: "3"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Ephemeral container credential; not a secret.
  MYSQL_ROOT_PASSWORD: "DbRelay_CI_Pa55w0rd"

jobs:
  soak-mysql:
    name: MySQL soak
    runs-on: ubuntu-latest
    timeout-minutes: 358
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent" --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      DBRELAY_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=DbRelay_CI_Pa55w0rd;SslMode=Preferred;AllowPublicKeyRetrieval=true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Settings
        id: settings
        run: |
          minutes="${{ inputs.minutes }}"; rate="${{ inputs.rate }}"; workers="${{ inputs.workers }}"
          echo "minutes=${minutes:-320}" >> "$GITHUB_OUTPUT"; echo "rate=${rate:-1.7}" >> "$GITHUB_OUTPUT"; echo "workers=${workers:-3}" >> "$GITHUB_OUTPUT"
          echo "Soak: ${minutes:-320} minutes, rate ${rate:-1.7}, ${workers:-3} workers"
      - name: Build the soak harness
        run: dotnet build tests/DbRelay.Soak -c Release
      - name: Soak
        run: >-
          dotnet tests/DbRelay.Soak/bin/Release/net10.0/DbRelay.Soak.dll coordinator --provider MySql
          --minutes ${{ steps.settings.outputs.minutes }} --workers ${{ steps.settings.outputs.workers }}
          --rate ${{ steps.settings.outputs.rate }} --report soak-mysql.md
      - name: Report
        if: always()
        run: cat soak-mysql.md || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-mysql
          path: |
            soak-mysql.md
            /tmp/dbrelay-soak_*/*.log
          if-no-files-found: warn
