name: Bug report
description: Something in DbRelay does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security vulnerabilities must not be reported here**; see SECURITY.md.
        Please never paste connection strings, passwords or message payloads.
  - type: input
    id: version
    attributes:
      label: DbRelay version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Storage provider
      options:
        - PostgreSQL
        - SQL Server
        - Azure SQL
        - Other / custom provider
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database version
      placeholder: "PostgreSQL 17.5, SQL Server 2022 CU15, ... (for SQL Server, say whether READ_COMMITTED_SNAPSHOT is on)"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET runtime and OS
      placeholder: ".NET 10.0.15 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the message status, attempt count and last_error from IOutboxAdmin.GetAsync if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: If possible, link the guarantee in docs/reliability.md you believe was violated.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The AddDbRelay configuration, the enqueue code (including how the connection and transaction are created) and the handler.
      render: csharp
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: DbRelay event IDs (1000 to 1101) are especially useful. Remove anything sensitive.
      render: text
